  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-orange-500 selection:text-white font-sans min-h-screen">

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.update();
          }
        }).catch(() => {});
      }
    </script>
